name: Verify Pages

on:
  push:
    paths:
      - '.github/workflows/verify-pages.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check live Pages site
        run: |
          set -e
          echo "== repo index.html =="
          wc -c index.html
          md5sum index.html
          echo "== live site headers =="
          curl -s -D /tmp/headers.txt -o /tmp/page.html "https://sisyphe2620.github.io/English-Match/"
          cat /tmp/headers.txt
          echo "== live site file =="
          wc -c /tmp/page.html
          md5sum /tmp/page.html
          echo "== expected =="
          echo "bytes: 10402245"
          echo "md5: 1431db87e288ea7e6ed1a25627300b77"
          test "$(wc -c < /tmp/page.html | tr -d ' ')" = "10402245"
          test "$(md5sum /tmp/page.html | cut -d' ' -f1)" = "1431db87e288ea7e6ed1a25627300b77"
          grep -i "content-type: text/html" /tmp/headers.txt
          echo "VERIFY OK"
