name: Verify Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Pages site
        run: |
          for i in $(seq 1 30); do
            curl -s -D /tmp/headers.txt -o /tmp/page.html -w "attempt $i: HTTP %{http_code} size %{size_download} type %{content_type}\n" https://sisyphe2620.github.io/English-Match/
            grep -i '^content-type:' /tmp/headers.txt || true
            echo "bytes: $(wc -c < /tmp/page.html)"
            echo "md5: $(md5sum /tmp/page.html | cut -d' ' -f1)"
            if [ "$(md5sum /tmp/page.html | cut -d' ' -f1)" = "1e668f3b1c50f58376a106ce58a716a8" ]; then
              echo "VERIFIED: byte count 12276922, md5 matches"
              exit 0
            fi
            sleep 10
          done
          echo "FAILED: deployed site did not match expected md5 within timeout"
          exit 1
