name: Replace index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with uploaded file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm index.html
          git mv xiang-su-lian-lian-kan.html index.html
          git commit -m "Replace index.html with batch 22+23 game file (1150 words, 145 levels)"
          git push
