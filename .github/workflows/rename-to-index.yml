name: Rename uploaded file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with uploaded file
        run: |
          set -e
          test -f xiang-su-lian-lian-kan.html
          test -f index.html
          git rm index.html
          git mv xiang-su-lian-lian-kan.html index.html
          ls -l index.html
          git config user.name "Sisyphe2620"
          git config user.email "Sisyphe2620@users.noreply.github.com"
          git commit -m "Replace index.html with rebuilt English-Match game (bottom-crop fix, batch 18 icons, 899 icons)"
          git push
