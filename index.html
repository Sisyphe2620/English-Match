<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>英语碰碰乐</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #e3ecf5;
        --bg-dot: #cbdcee;
        --card: #faf1dc;
        --card-edge: #e8d9b8;
        --mini-card: #f5ead0;
        --ink: #2e2a5e;
        --ink-soft: #6f6a94;
        --teal: #14b8a6;
        --teal-track: #eadfc6;
        --gold: #f5b921;
        --tile: #f7ecd2;
        --tile-edge: #e2d0a8;
        --tile-sel: #14b8a6;
        --btn: #faf1dc;
        --btn-edge: #dcc894;
        --shadow: rgba(94, 74, 32, 0.16);
        --pop-bg: #fffaf0;
      }
      /* Light palette only — the approved concept art is light everywhere,
         so the page never switches to a dark scheme. */
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Baloo 2", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        background:
          radial-gradient(var(--bg-dot) 1.6px, transparent 1.7px) 0 0 / 26px 26px,
          var(--bg);
        color: var(--ink);
        display: flex;
        justify-content: center;
      }
      .app {
        width: 100%;
        max-width: 460px;
        height: 100dvh;
        overflow: hidden;
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* ---------- Header card ---------- */
      .hud {
        background: var(--card);
        border: 2px solid var(--card-edge);
        border-radius: 26px;
        box-shadow: 0 6px 0 var(--card-edge), 0 14px 24px var(--shadow);
        padding: 16px 18px 14px;
        display: flex;
        gap: 14px;
        align-items: stretch;
      }
      .hud-left { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
      .level-row { display: flex; align-items: center; gap: 8px; }
      .level-text {
        font-size: clamp(30px, 9vw, 40px);
        font-weight: 800;
        letter-spacing: 0.5px;
        line-height: 1;
        white-space: nowrap;
      }
      .level-star { width: 30px; height: 30px; flex: 0 0 auto; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.12)); }
      .bar {
        margin-top: 12px;
        height: 20px;
        border-radius: 999px;
        background: var(--teal-track);
        position: relative;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--teal);
        transition: width 0.45s cubic-bezier(0.34, 1.3, 0.64, 1);
        position: relative;
      }
      .bar-fill::after {
        content: "";
        position: absolute;
        right: -4px; top: 50%;
        width: 24px; height: 24px;
        transform: translateY(-50%);
        border-radius: 50%;
        background: var(--teal);
        border: 3px solid var(--card);
      }
      .bar-label {
        margin-top: 9px;
        color: var(--teal);
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 1.5px;
      }
      .hud-right { flex: 0 0 118px; display: flex; flex-direction: column; gap: 10px; }
      .mini {
        flex: 1;
        background: var(--mini-card);
        border: 2px solid var(--card-edge);
        border-radius: 18px;
        box-shadow: 0 3px 0 var(--card-edge);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
      }
      .mini svg { width: 24px; height: 24px; flex: 0 0 auto; }
      .mini .k { font-size: 12px; font-weight: 800; letter-spacing: 1px; line-height: 1.05; color: var(--ink); }
      .mini .v { font-size: 21px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }

      .tip {
        text-align: center;
        color: var(--ink-soft);
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.4px;
        margin: -2px 0 -4px;
      }

      /* ---------- Board ---------- */
      .board-wrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-start; justify-content: center; }
      .board {
        /* --cell is the exact tile edge length in px. fitBoard() in the
           script measures the real space between the tip line and the
           bottom buttons and sets --cell from the TIGHTER of the width
           limit and the height limit, so all 6 columns and 8 rows always
           fit inside one screen. The fallback value here only applies
           before the script runs. Tiles take explicit width/height from
           --cell (no aspect-ratio), so they are true 1:1 squares in
           every webview. */
        --cell: 52px;
        width: calc(var(--cell) * 6 + 40px);
        max-width: 100%;
        display: grid;
        grid-template-columns: repeat(6, var(--cell));
        grid-auto-rows: var(--cell);
        gap: 8px;
      }
      .tile {
        appearance: none;
        width: var(--cell);
        height: var(--cell);
        border: 2px solid var(--tile-edge);
        background: var(--tile);
        border-radius: 20%;
        /* Icon box = 100% - 2 x 17.5% = 65% of the tile, centered. */
        padding: 17.5%;
        cursor: pointer;
        box-shadow: 0 4px 0 var(--tile-edge);
        touch-action: manipulation;
        transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, opacity 0.25s ease;
        position: relative;
      }
      .tile svg { width: 100%; height: 100%; display: block; }
      .tile:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--tile-edge); }
      /* deal MUST stay above the state rules below. .tile.deal,
         .tile.selected, .tile.hint, .tile.wrong and .tile.matched all
         share the same specificity, so for the `animation` property the
         later rule wins. dealIn is long finished by the time the player
         taps anything; if .tile.deal came after .tile.hint, its dead
         animation would silently override the hint pulse (and the wrong
         shake and match pop) — HINT then looks like it does nothing.
         The script also strips the deal class once dealIn ends. */
      .tile.deal { animation: dealIn 0.4s cubic-bezier(0.34, 1.4, 0.64, 1) backwards; }
      @keyframes dealIn {
        from { transform: scale(0.3) rotate(-6deg); opacity: 0; }
        to { transform: scale(1) rotate(0); opacity: 1; }
      }
      .tile.selected {
        border-color: var(--tile-sel);
        transform: translateY(-4px) scale(1.06);
        box-shadow: 0 8px 0 var(--tile-sel), 0 14px 20px var(--shadow);
        z-index: 2;
      }
      .tile.hint {
        border-color: var(--gold);
        animation: hintPulse 0.55s ease-in-out 3;
        z-index: 2;
      }
      @keyframes hintPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 4px 0 var(--gold); }
        50% { transform: scale(1.12); box-shadow: 0 4px 0 var(--gold), 0 0 0 6px rgba(245, 185, 33, 0.35); }
      }
      .tile.wrong { animation: shake 0.32s ease; border-color: #ef5350; }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .tile.matched { animation: popOut 0.38s ease forwards; pointer-events: none; }
      @keyframes popOut {
        0% { transform: scale(1); opacity: 1; }
        45% { transform: scale(1.22); opacity: 1; }
        100% { transform: scale(0.2); opacity: 0; }
      }
      .tile.gone { visibility: hidden; pointer-events: none; box-shadow: none; }
      .tile.flip { animation: flipIt 0.35s ease; }
      @keyframes flipIt {
        0% { transform: rotateY(0); }
        50% { transform: rotateY(90deg) scale(0.9); }
        100% { transform: rotateY(0); }
      }

      /* ---------- Bottom controls ---------- */
      .controls { display: flex; align-items: center; gap: 12px; }
      .ctl-btn {
        flex: 1;
        appearance: none;
        border: 2px solid var(--btn-edge);
        background: var(--btn);
        color: var(--ink);
        border-radius: 20px;
        box-shadow: 0 5px 0 var(--btn-edge);
        padding: 13px 10px;
        font-family: inherit;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 2px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        touch-action: manipulation;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      .ctl-btn svg { width: 24px; height: 24px; }
      .ctl-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--btn-edge); }
      .ctl-btn.hint-btn {
        background: var(--teal);
        border-color: #0d9488;
        color: #fff;
        box-shadow: 0 5px 0 #0d9488;
      }
      .ctl-btn.hint-btn:active { box-shadow: 0 2px 0 #0d9488; }
      .ctl-btn.shuffle-btn {
        background: #ff6f61;
        border-color: #e05244;
        color: #fff;
        box-shadow: 0 5px 0 #e05244;
      }
      .ctl-btn.shuffle-btn:active { box-shadow: 0 2px 0 #e05244; }
      .sound-btn {
        flex: 0 0 auto;
        width: 52px; height: 52px;
        border-radius: 50%;
        padding: 0;
        letter-spacing: 0;
      }
      .sound-btn svg { width: 24px; height: 24px; }
      .sound-btn.off { opacity: 0.55; }

      /* ---------- Word popup ---------- */
      .word-pop {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 40;
        opacity: 0;
      }
      .word-pop.show { animation: wordShow 1.2s cubic-bezier(0.34, 1.4, 0.64, 1) forwards; }
      @keyframes wordShow {
        0% { opacity: 0; transform: scale(0.5) translateY(16px); }
        16% { opacity: 1; transform: scale(1.08) translateY(0); }
        22% { transform: scale(1); }
        82% { opacity: 1; transform: scale(1) translateY(0); }
        100% { opacity: 0; transform: scale(0.94) translateY(-12px); }
      }
      .word-card {
        background: var(--pop-bg);
        border: 3px solid var(--card-edge);
        border-radius: 28px;
        box-shadow: 0 10px 0 var(--card-edge), 0 26px 50px rgba(60, 45, 10, 0.3);
        padding: 22px 38px 18px;
        text-align: center;
      }
      .word-card .wc-icon { width: 104px; height: 104px; margin: 0 auto; }
      .word-card .wc-icon svg { width: 100%; height: 100%; }
      .word-card .wc-word {
        font-size: 46px;
        font-weight: 800;
        letter-spacing: 3px;
        line-height: 1.1;
        margin-top: 6px;
      }
      .word-card .wc-zh { font-size: 17px; font-weight: 700; color: var(--ink-soft); letter-spacing: 4px; }
      .word-card .wc-plus { font-size: 20px; font-weight: 800; color: var(--gold); margin-top: 2px; }

      /* ---------- Win overlay ---------- */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(70, 95, 130, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 20px;
      }
      .overlay.show { display: flex; }
      .win-card {
        background: var(--pop-bg);
        border: 3px solid var(--card-edge);
        border-radius: 30px;
        box-shadow: 0 10px 0 var(--card-edge), 0 30px 60px rgba(0,0,0,0.35);
        padding: 30px 34px 26px;
        text-align: center;
        max-width: 340px;
        width: 100%;
        animation: winIn 0.45s cubic-bezier(0.34, 1.5, 0.64, 1);
      }
      @keyframes winIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .win-card .win-icons { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
      .win-card .win-icons .wi { width: 32px; height: 32px; }
      .win-card .win-icons svg { width: 100%; height: 100%; }
      .win-title { font-size: 42px; font-weight: 800; letter-spacing: 2px; line-height: 1.1; color: #f0564a; text-shadow: 0 2px 0 rgba(214, 58, 48, 0.22); }
      .win-sub { font-size: 16px; font-weight: 700; color: var(--ink-soft); margin-top: 4px; letter-spacing: 2px; }
      .win-stats { display: flex; justify-content: center; gap: 26px; margin: 18px 0 22px; }
      .win-stats .ws .k { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--ink-soft); }
      .win-stats .ws .v { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
      .win-btn {
        appearance: none;
        border: none;
        background: var(--teal);
        color: #fff;
        font-family: inherit;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 1.5px;
        border-radius: 18px;
        padding: 14px 26px;
        cursor: pointer;
        box-shadow: 0 5px 0 #0d9488;
        touch-action: manipulation;
        width: 100%;
      }
      .win-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0d9488; }
      .confetti { position: fixed; top: -16px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
      .confetti.round { border-radius: 50%; }
      .confetti.ribbon { animation-name: fallSway; }
      @keyframes fall {
        to { transform: translateY(110dvh) rotate(560deg); }
      }
      @keyframes fallSway {
        0% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(16px, 27dvh) rotate(160deg); }
        50% { transform: translate(-14px, 55dvh) rotate(320deg); }
        75% { transform: translate(14px, 82dvh) rotate(480deg); }
        100% { transform: translate(0, 110dvh) rotate(640deg); }
      }
      /* Firework burst particles: fly outward along --dx/--dy set in JS. */
      .fw-particle {
        position: fixed;
        z-index: 61;
        pointer-events: none;
        border-radius: 50%;
        animation: fwBurst 0.95s cubic-bezier(0.17, 0.67, 0.35, 1) forwards;
      }
      @keyframes fwBurst {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        70% { opacity: 1; }
        100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.35); opacity: 0; }
      }
      .win-card .win-icons .wi { animation: wiBounce 0.85s ease-in-out infinite; }
      @keyframes wiBounce {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        30% { transform: translateY(-9px) rotate(-6deg); }
        60% { transform: translateY(1px) rotate(5deg); }
      }
      .win-title { animation: titleBounce 1.15s ease-in-out infinite; }
      @keyframes titleBounce {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.07); }
      }
      @media (prefers-reduced-motion: reduce) {
        .tile, .bar-fill, .ctl-btn { transition: none; }
        .tile.hint, .tile.wrong, .tile.matched, .tile.deal, .tile.flip, .win-card, .confetti, .fw-particle, .win-title, .win-card .win-icons .wi { animation-duration: 0.01s; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- Header: level + progress | score / time -->
      <header class="hud">
        <div class="hud-left">
          <div class="level-row">
            <div class="level-text">LEVEL <span id="levelNum">1</span></div>
            <svg class="level-star" viewBox="0 0 24 24" aria-hidden="true"><path fill="#f5b921" stroke="#d99a0b" stroke-width="1.6" stroke-linejoin="round" d="M12 2.6l2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17.7l-6 3.3 1.3-6.7-5-4.7 6.8-.8z"/></svg>
          </div>
          <div class="bar"><div class="bar-fill" id="barFill"></div></div>
          <div class="bar-label"><span id="barPct">0%</span><span id="barTail"> TO LEVEL </span><span id="barNext">2</span></div>
        </div>
        <div class="hud-right">
          <div class="mini">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f5b921" stroke="#d99a0b" stroke-width="1.6" stroke-linejoin="round" d="M12 2.6l2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17.7l-6 3.3 1.3-6.7-5-4.7 6.8-.8z"/></svg>
            <div><div class="k">SCORE</div><div class="v" id="scoreVal">0</div></div>
          </div>
          <div class="mini">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4" fill="#f0762a"/><circle cx="12" cy="12" r="7.6" fill="none" stroke="#f0762a" stroke-width="2.4"/><path d="M12 1.8v3.4M12 18.8v3.4M1.8 12h3.4M18.8 12h3.4" stroke="#f0762a" stroke-width="2.4" stroke-linecap="round"/></svg>
            <div><div class="k">MOVES</div><div class="v" id="movesVal">0</div></div>
          </div>
        </div>
      </header>

      <p class="tip">点两个相同的图标，就能把它们消掉</p>

      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="连连看棋盘"></div>
      </div>

      <div class="controls">
        <button class="ctl-btn hint-btn" id="hintBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.2 1.1 2.2h5c0-1 .4-1.6 1.1-2.2A6 6 0 0 0 12 3z" fill="#ffd94d" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
          HINT
        </button>
        <button class="ctl-btn sound-btn" id="soundBtn" type="button" aria-label="声音开关">
          <svg id="soundOnIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.6V5.4L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
          <svg id="soundOffIcon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M4 9.5v5h3.5L12 18.6V5.4L7.5 9.5H4z" fill="currentColor"/><path d="M16 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
        </button>
        <button class="ctl-btn shuffle-btn" id="shuffleBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7h4l10 10h3.5m0 0-2.6-2.6M21 17l-2.6 2.6M3.5 17h4l2.4-2.4m3.2-3.2 4.4-4.4h3.5m0 0-2.6-2.6M21 7l-2.6 2.6" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          SHUFFLE
        </button>
      </div>
    </div>

    <!-- Word popup -->
    <div class="word-pop" id="wordPop" aria-live="polite">
      <div class="word-card">
        <div class="wc-icon" id="wcIcon"></div>
        <div class="wc-word" id="wcWord">APPLE</div>
        <div class="wc-zh" id="wcZh">苹果</div>
        <div class="wc-plus">+10</div>
      </div>
    </div>

    <!-- Win overlay -->
    <div class="overlay" id="winOverlay">
      <div class="win-card">
        <div class="win-icons" id="winIcons"></div>
        <div class="win-title" id="winTitle">YOU WIN!</div>
        <div class="win-sub" id="winSub">全部消完啦，太棒了！</div>
        <div class="win-stats">
          <div class="ws"><div class="k">SCORE</div><div class="v" id="winScore">0</div></div>
          <div class="ws"><div class="k">MOVES</div><div class="v" id="winMoves">0</div></div>
          <div class="ws"><div class="k">LEVEL</div><div class="v" id="winLevel">1</div></div>
        </div>
        <button class="win-btn" id="againBtn" type="button">下一关 · NEXT LEVEL</button>
      </div>
    </div>

    <script>
      "use strict";
      /* ============================================================
         Pixel icons — each icon is a 24x24 pixel matrix drawn in code.
         Rows are strings; each character maps to a palette color.
         "." = transparent.
         ============================================================ */
      var E = "........................";
      var ICONS = {
        apple: {
          word: "APPLE", zh: "苹果",
          pal: { b: "#8a5a2b", g: "#46b04e", G: "#2f8f3e", r: "#f04438", R: "#c22f33", w: "#ffc4bc" },
          rows: [
            E,
            "..........bb............",
            "..........bb....ggg.....",
            "..........bb..gggGggg...",
            "..........bb...ggggg....",
            ".....rrrrrbbrrrrr.......",
            "...rrrrrrrrrrrrrrrrr....",
            "..rrrrrrrrrrrrrrrrrrr...",
            "..rwwrrrrrrrrrrrrrrrRR..",
            ".rwwwrrrrrrrrrrrrrrrRR..",
            ".rwwrrrrrrrrrrrrrrrrRR..",
            ".rrrrrrrrrrrrrrrrrrrRR..",
            ".rrrrrrrrrrrrrrrrrrrRR..",
            ".rrrrrrrrrrrrrrrrrrrRR..",
            "..rrrrrrrrrrrrrrrrrRR...",
            "..rrrrrrrrrrrrrrrrrRR...",
            "...rrrrrrrrrrrrrrrRR....",
            "...rrrrrrrrrrrrrrrRR....",
            "....rrrrrrrrrrrrrRR.....",
            ".....rrrrrrrrrrRR.......",
            ".......rrrrrrrr.........",
            E, E, E
          ]
        },
        coffee: {
          word: "COFFEE", zh: "咖啡",
          pal: { s: "#a9bfc9", C: "#6f4520", c: "#9c6a35", M: "#e0d0ac", m: "#fdfaf0", h: "#fdfaf0", p: "#ead9b8", P: "#d3ba85" },
          rows: [
            E,
            ".....ss....ss...........",
            "....ss......ss..........",
            ".....ss....ss...........",
            "....ss......ss..........",
            E,
            "....CCCCCCCCCCCC........",
            "....CccccccccccC........",
            "....MmmmmmmmmmmMhhhh....",
            "....MmmmmmmmmmmM...hh...",
            "....MmmmmccmmmmM...hh...",
            "....MmmmccccmmmM...hh...",
            "....MmmmmccmmmmM...hh...",
            "....MmmmmmmmmmmMhhhh....",

        ["dragon", "mermaid", "wizard", "phoenix", "zombie", "mummy", "werewolf", "goblin", "troll", "ogre", "cyclops", "minotaur"],

      /* Build an SVG string from a pixel matrix (rects merged per row run). */
      function pixelSVG(icon) {
        var out = ['<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'];
        for (var y = 0; y < icon.rows.length; y++) {
          var row = icon.rows[y];
          var x = 0;
          while (x < row.length) {
            var ch = row[x];
            if (ch === "." || !icon.pal[ch]) { x++; continue; }
            var x2 = x;
            while (x2 < row.length && row[x2] === ch) x2++;
            out.push('<rect x="' + x + '" y="' + y + '" width="' + (x2 - x) + '" height="1" fill="' + icon.pal[ch] + '"/>');
            x = x2;
          }
        }
        out.push("</svg>");
        return out.join("");
      }
      var svgCache = {};
      TYPE_KEYS.forEach(function (k) { svgCache[k] = pixelSVG(ICONS[k]); });

      /* ---------------- Game state ---------------- */
      var COLS = 6, ROWS = 8, TOTAL = COLS * ROWS, PAIRS = TOTAL / 2;
      var boardEl = document.getElementById("board");
      var scoreEl = document.getElementById("scoreVal");
      var movesEl = document.getElementById("movesVal");
      var barFill = document.getElementById("barFill");
      var barPct = document.getElementById("barPct");
      var barNext = document.getElementById("barNext");
      var barTail = document.getElementById("barTail");
      var levelEl = document.getElementById("levelNum");
      var wordPop = document.getElementById("wordPop");
      var wcIcon = document.getElementById("wcIcon");
      var wcWord = document.getElementById("wcWord");
      var wcZh = document.getElementById("wcZh");
      var winOverlay = document.getElementById("winOverlay");
      var boardWrap = boardEl.parentElement;

      /* Size the board from the space actually left between the header/tip
         and the bottom buttons. The tile edge is computed from BOTH
         directions and the tighter one wins: the 6 columns (plus gaps)
         must fit the wrap width AND the 8 rows (plus gaps) must fit the
         wrap height, so the right column never leaves the frame and the
         last row always clears the HINT / SHUFFLE buttons. */
      var GAP = 8;
      function fitBoard() {
        var w = boardWrap.clientWidth;
        var h = boardWrap.clientHeight;
        if (!w || !h) return;
        var cell = Math.floor(Math.min(
          (w - GAP * (COLS - 1)) / COLS,
          (h - GAP * (ROWS - 1)) / ROWS
        ));
        if (cell < 8) return;
        boardEl.style.setProperty("--cell", cell + "px");
        boardEl.style.width = (cell * COLS + GAP * (COLS - 1)) + "px";
      }
      window.addEventListener("resize", fitBoard);
      window.addEventListener("orientationchange", fitBoard);
      window.addEventListener("load", fitBoard);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fitBoard);
      }

      var tiles = [];        // type key or null per cell
      var tileEls = [];
      var selected = -1;
      var score = 0;
      var moves = 0;
      var matchedPairs = 0;
      var level = 1;
      var lock = false;
      var soundOn = true;

      function shuffled(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      }

      function newGame(lv) {
        level = lv;
        levelEl.textContent = lv;
        if (lv >= LEVELS.length) {
          barTail.textContent = " · 最后一关";
          barNext.style.display = "none";
        } else {
          barTail.textContent = " TO LEVEL ";
          barNext.style.display = "";
          barNext.textContent = lv + 1;
        }
        score = 0;
        moves = 0;
        matchedPairs = 0;
        selected = -1;
        lock = false;
        scoreEl.textContent = "0";
        movesEl.textContent = "0";
        barFill.style.width = "0%";
        barPct.textContent = "0%";
        winOverlay.classList.remove("show");

        // Deal this level's types: level 1 gives each of its 8 types
        // 3 pairs (6 copies); levels 2+ give each of their 12 types
        // 2 pairs (4 copies). Either way: 48 tiles, 24 pairs.
        var types = LEVELS[level - 1];
        var copies = level === 1 ? 6 : 4;
        var deck = [];
        types.forEach(function (k) { for (var i = 0; i < copies; i++) deck.push(k); });
        tiles = shuffled(deck);

        boardEl.innerHTML = "";
        tileEls = [];
        tiles.forEach(function (type, idx) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "tile deal";
          b.style.animationDelay = (idx * 18) + "ms";
          b.setAttribute("role", "gridcell");
          b.setAttribute("aria-label", ICONS[type].word);
          b.innerHTML = svgCache[type];
          /* Once dealIn has played, drop the deal class: while it sits
             on the tile its (finished) animation can win the cascade
             over the hint/wrong/matched animations and mute them. */
          b.addEventListener("animationend", function () { b.classList.remove("deal"); });
          b.addEventListener("click", function () { onTileTap(idx); });
          boardEl.appendChild(b);
          tileEls.push(b);
        });
        fitBoard();
        playStartJingle();
        /* Re-measure one frame later, once the fresh layout has settled. */
        if (window.requestAnimationFrame) requestAnimationFrame(fitBoard);
      }

      /* Prefer a bright, friendly-sounding English voice when the device
         offers one; otherwise fall back to any US English voice, then any
         English voice, then the system default (null). speak() pairs it
         with a gentle pitch (1.1) and an unhurried rate (0.9) so the
         word stays friendly but comes out clear and never rushed,
         whichever voice ends up used. */
      function pickLivelyVoice(voices) {
        var en = [];
        for (var i = 0; i < voices.length; i++) {
          if (/^en([-_]|$)/i.test(voices[i].lang)) en.push(voices[i]);
        }
        if (!en.length) return null;
        var fav = [/google us english/i, /samantha/i, /aria/i, /jenny/i,
                   /zira/i, /allison/i, /ava/i, /susan/i, /karen/i,
                   /moira/i, /tessa/i, /serena/i, /kate/i, /female/i];
        for (var f = 0; f < fav.length; f++) {
          for (var j = 0; j < en.length; j++) {
            if (fav[f].test(en[j].name)) return en[j];
          }
        }
        for (var k = 0; k < en.length; k++) {
          if (/^en[-_]US/i.test(en[k].lang)) return en[k];
        }
        return en[0];
      }

      /* Three rotating "voice actors" per word. Persona 1 is the lively
         voice above; persona 2 prefers a deeper / male-named English
         voice; persona 3 prefers another bright English voice. Each
         persona also carries its own pitch and rate, so on devices that
         offer fewer than three English voices the personas still sound
         clearly different (same voice, different pitch/pace). */
      function unusedEn(voices, used) {
        var out = [];
        for (var i = 0; i < voices.length; i++) {
          if (!/^en([-_]|$)/i.test(voices[i].lang)) continue;
          var seen = false;
          for (var j = 0; j < used.length; j++) { if (used[j] === voices[i]) { seen = true; break; } }
          if (!seen) out.push(voices[i]);
        }
        return out;
      }
      function pickByName(list, patterns) {
        for (var f = 0; f < patterns.length; f++) {
          for (var j = 0; j < list.length; j++) {
            if (patterns[f].test(list[j].name)) return list[j];
          }
        }
        return list.length ? list[0] : null;
      }
      function buildPersonas(voices) {
        var used = [];
        var v1 = pickLivelyVoice(voices);
        if (v1) used.push(v1);
        var v2 = pickByName(unusedEn(voices, used),
          [/google uk english male/i, /david/i, /daniel/i, /george/i,
           /arthur/i, /christopher/i, /guy/i, /ryan/i, /fred/i, /alex/i, /male/i]);
        if (v2) used.push(v2);
        var v3 = pickByName(unusedEn(voices, used),
          [/google uk english female/i, /fiona/i, /victoria/i, /veena/i,
           /hazel/i, /serena/i, /female/i]);
        return [
          { voice: v1, pitch: 1.1, rate: 0.9 },
          { voice: v2 || v1, pitch: 0.8, rate: 0.88 },
          { voice: v3 || v1, pitch: 1.35, rate: 0.95 }
        ];
      }

      function speak(word, personaIdx) {
        if (!soundOn) return;
        try {
          var synth = window.speechSynthesis;
          if (!synth) return;
          synth.cancel();
          var personas = buildPersonas(synth.getVoices());
          var p = personas[(personaIdx || 0) % personas.length];
          var u = new SpeechSynthesisUtterance(word);
          u.lang = "en-US";
          u.rate = p.rate;
          u.pitch = p.pitch;
          if (p.voice) u.voice = p.voice;
          synth.speak(u);
        } catch (e) { /* speech is a bonus; game continues silently */ }
      }

      /* Per-word rotation: each word keeps its own turn counter, so the
         1st match of a word uses persona 1, the 2nd match persona 2,
         the 3rd persona 3, then it wraps around — independently for
         every word. Hearing the same word in three different voices
         helps the pronunciation stick. */
      var wordVoiceTurn = {};
      function speakWord(word) {
        var turn = wordVoiceTurn[word] || 0;
        wordVoiceTurn[word] = turn + 1;
        speak(word, turn % 3);
      }
      if (window.speechSynthesis) {
        try { window.speechSynthesis.getVoices(); } catch (e) {}
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = function () {
            try { window.speechSynthesis.getVoices(); } catch (e) {}
          };
        }
      }

      function showWord(type) {
        var icon = ICONS[type];
        wcIcon.innerHTML = svgCache[type];
        wcWord.textContent = icon.word;
        wcWord.style.fontSize = icon.word.length > 12 ? "26px"
          : icon.word.length > 10 ? "30px"
          : icon.word.length > 8 ? "36px"
          : icon.word.length > 6 ? "42px" : "";
        wcZh.textContent = icon.zh;
        wordPop.classList.remove("show");
        void wordPop.offsetWidth; /* restart animation */
        wordPop.classList.add("show");
      }

      function updateProgress() {
        var pct = Math.round((matchedPairs / PAIRS) * 100);
        barFill.style.width = pct + "%";
        barPct.textContent = pct + "%";
      }

      function clearHints() {
        tileEls.forEach(function (el) { el.classList.remove("hint"); });
      }

      function onTileTap(idx) {
        if (lock || tiles[idx] === null) return;
        moves++;
        movesEl.textContent = moves;
        clearHints();
        if (selected === idx) {
          tileEls[idx].classList.remove("selected");
          selected = -1;
          return;
        }
        if (selected === -1) {
          selected = idx;
          tileEls[idx].classList.add("selected");
          return;
        }
        var first = selected;
        var a = tiles[first], b = tiles[idx];
        if (a === b) {
          lock = true;
          selected = -1;
          tileEls[first].classList.remove("selected");
          tileEls[first].classList.add("matched");
          tileEls[idx].classList.add("matched");
          showWord(b);
          speakWord(ICONS[b].word);
          score += 10;
          scoreEl.textContent = score;
          matchedPairs++;
          updateProgress();
          setTimeout(function () {
            tiles[first] = null;
            tiles[idx] = null;
            tileEls[first].classList.add("gone");
            tileEls[idx].classList.add("gone");
            lock = false;
            if (matchedPairs === PAIRS) onWin();
          }, 400);
        } else {
          lock = true;
          playFailSound();
          tileEls[first].classList.add("wrong");
          tileEls[idx].classList.add("wrong");
          setTimeout(function () {
            tileEls[first].classList.remove("wrong", "selected");
            tileEls[idx].classList.remove("wrong");
            tileEls[idx].classList.add("selected");
            selected = idx;
            lock = false;
          }, 330);
        }
      }

      function findPair() {
        var seen = {};
        for (var i = 0; i < tiles.length; i++) {
          var t = tiles[i];
          if (t === null) continue;
          if (seen[t] !== undefined) return [seen[t], i];
          seen[t] = i;
        }
        return null;
      }

      document.getElementById("hintBtn").addEventListener("click", function () {
        if (lock) return;
        var pair = findPair();
        if (!pair) return;
        clearHints();
        tileEls[pair[0]].classList.add("hint");
        tileEls[pair[1]].classList.add("hint");
        setTimeout(clearHints, 1800);
      });

      document.getElementById("shuffleBtn").addEventListener("click", function () {
        if (lock) return;
        if (selected !== -1) { tileEls[selected].classList.remove("selected"); selected = -1; }
        clearHints();
        var rest = [], idxs = [];
        tiles.forEach(function (t, i) { if (t !== null) { rest.push(t); idxs.push(i); } });
        if (rest.length < 2) return;
        shuffled(rest);
        idxs.forEach(function (cellIdx, k) {
          tiles[cellIdx] = rest[k];
          tileEls[cellIdx].innerHTML = svgCache[rest[k]];
          tileEls[cellIdx].setAttribute("aria-label", ICONS[rest[k]].word);
          tileEls[cellIdx].classList.remove("flip");
          void tileEls[cellIdx].offsetWidth;
          tileEls[cellIdx].classList.add("flip");
        });
      });

      var soundBtn = document.getElementById("soundBtn");
      soundBtn.addEventListener("click", function () {
        soundOn = !soundOn;
        soundBtn.classList.toggle("off", !soundOn);
        document.getElementById("soundOnIcon").style.display = soundOn ? "" : "none";
        document.getElementById("soundOffIcon").style.display = soundOn ? "none" : "";
        if (!soundOn && window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) {} }
      });

      var reducedMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      var CELEB_COLORS = ["#f04438", "#ffcf3f", "#14b8a6", "#4f83e3", "#ff8fab", "#46b04e", "#f5b921", "#9b59b6"];

      function confettiWave(count) {
        for (var i = 0; i < count; i++) {
          var d = document.createElement("div");
          var kind = Math.random();
          d.className = "confetti" + (kind < 0.35 ? " round" : kind < 0.65 ? " ribbon" : "");
          var w = 6 + Math.random() * 7;
          d.style.width = w + "px";
          d.style.height = (kind >= 0.35 && kind < 0.65 ? w * 1.9 : w) + "px";
          d.style.left = (Math.random() * 100) + "vw";
          d.style.background = CELEB_COLORS[Math.floor(Math.random() * CELEB_COLORS.length)];
          d.style.animationDuration = (1.8 + Math.random() * 1.8) + "s";
          document.body.appendChild(d);
          (function (el) { setTimeout(function () { el.remove(); }, 4600); })(d);
        }
      }

      function confetti() {
        if (reducedMotion) { confettiWave(72); return; }
        confettiWave(120);
        setTimeout(function () { confettiWave(90); }, 380);
        setTimeout(function () { confettiWave(72); }, 760);
      }

      function fireworkBurst(cx, cy, colors) {
        var n = 16;
        for (var i = 0; i < n; i++) {
          var p = document.createElement("div");
          p.className = "fw-particle";
          var size = 5 + Math.random() * 5;
          p.style.width = size + "px";
          p.style.height = size + "px";
          p.style.left = cx + "vw";
          p.style.top = cy + "dvh";
          p.style.background = colors[i % colors.length];
          var ang = (Math.PI * 2 * i) / n + Math.random() * 0.3;
          var dist = 55 + Math.random() * 65;
          p.style.setProperty("--dx", (Math.cos(ang) * dist) + "px");
          p.style.setProperty("--dy", (Math.sin(ang) * dist) + "px");
          document.body.appendChild(p);
          (function (el) { setTimeout(function () { el.remove(); }, 1100); })(p);
        }
      }

      function fireworks() {
        if (reducedMotion) return;
        var palettes = [
          ["#f5b921", "#ffcf3f", "#fff3b0"],
          ["#f0564a", "#ff8fab", "#ffd9a0"],
          ["#14b8a6", "#4f83e3", "#a8d8f8"]
        ];
        fireworkBurst(22 + Math.random() * 10, 18 + Math.random() * 8, palettes[0]);
        setTimeout(function () { fireworkBurst(62 + Math.random() * 14, 14 + Math.random() * 8, palettes[1]); }, 320);
        setTimeout(function () { fireworkBurst(38 + Math.random() * 16, 24 + Math.random() * 8, palettes[2]); }, 640);
      }

      /* Cheerful victory fanfare, synthesized with WebAudio (no audio
         files): a rising arpeggio, two bouncy melody phrases over a
         hopping bass line, a quick playful run-up, then a long held
         C-major chord with staggered sparkle notes on top (~3.9 s
         total). Follows the same sound on/off switch as word speech. */
      var audioCtx = null;
      function tone(freq, start, dur, type, vol) {
        var t = audioCtx.currentTime + start;
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.05);
      }

      /* Short cheerful opening melody for the start of every level,
         synthesized with WebAudio (no audio files): a quick rising
         C-D-E-G-C run with a sparkle note on top (~0.7 s), clearly
         shorter and lighter than the win fanfare. Follows the same
         sound on/off switch as word speech. On the very first page
         load the browser keeps the AudioContext suspended until the
         first tap, so if no tap has happened yet the jingle is
         deferred to that first tap instead of being queued silently
         and firing much later. */
      var userGestured = false;
      window.addEventListener("pointerdown", function () { userGestured = true; }, true);
      var startJingleRetryArmed = false;
      function playStartJingle() {
        if (!soundOn) return;
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          if (!audioCtx) audioCtx = new AC();
          if (audioCtx.state === "suspended") audioCtx.resume();
          if (audioCtx.state === "suspended" && !userGestured) {
            if (!startJingleRetryArmed) {
              startJingleRetryArmed = true;
              var retry = function () {
                startJingleRetryArmed = false;
                window.removeEventListener("pointerdown", retry);
                playStartJingle();
              };
              window.addEventListener("pointerdown", retry);
            }
            return;
          }
          var seq = [523.25, 587.33, 659.25, 783.99, 1046.5];
          for (var i = 0; i < seq.length; i++) tone(seq[i], i * 0.08, 0.16, "triangle", 0.24);
          tone(1318.5, 0.42, 0.24, "sine", 0.12);
        } catch (e) { /* music is a bonus; game continues silently */ }
      }

      /* Short descending "uh-oh" for a mismatched pair, synthesized
         with WebAudio (no audio files): two falling triangle notes,
         clearly different from the match/win sounds. Follows the same
         sound on/off switch as word speech. */
      function playFailSound() {
        if (!soundOn) return;
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          if (!audioCtx) audioCtx = new AC();
          if (audioCtx.state === "suspended") audioCtx.resume();
          tone(329.63, 0, 0.16, "triangle", 0.3);
          tone(246.94, 0.13, 0.26, "triangle", 0.3);
        } catch (e) { /* sound is a bonus; game continues silently */ }
      }

      function playWinJingle() {
        if (!soundOn) return;
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          if (!audioCtx) audioCtx = new AC();
          if (audioCtx.state === "suspended") audioCtx.resume();
          var arp = [523.25, 659.25, 783.99, 1046.5];
          for (var i = 0; i < arp.length; i++) tone(arp[i], i * 0.09, 0.22, "square", 0.27);
          var melA = [1046.5, 783.99, 1046.5, 1318.5];
          for (var j = 0; j < melA.length; j++) tone(melA[j], 0.38 + j * 0.11, 0.2, "triangle", 0.36);
          var melB = [1567.98, 1318.5, 1174.66, 1318.5];
          for (var m = 0; m < melB.length; m++) tone(melB[m], 0.84 + m * 0.11, 0.2, "triangle", 0.36);
          var bass = [261.63, 392.0, 329.63, 392.0, 261.63, 392.0];
          for (var b = 0; b < bass.length; b++) tone(bass[b], 0.38 + b * 0.22, 0.18, "triangle", 0.17);
          var run = [783.99, 1046.5, 783.99, 1046.5, 1318.5, 1567.98];
          for (var r = 0; r < run.length; r++) tone(run[r], 1.32 + r * 0.09, 0.16, "square", 0.2);
          var chord = [523.25, 659.25, 783.99, 1046.5];
          for (var k = 0; k < chord.length; k++) tone(chord[k], 1.92, 1.9, "triangle", 0.26);
          tone(1567.98, 1.92, 0.9, "sine", 0.2);
          tone(2093.0, 2.14, 0.8, "sine", 0.15);
          tone(2637.01, 2.36, 0.7, "sine", 0.12);
        } catch (e) { /* music is a bonus; game continues silently */ }
      }

      function onWin() {
        document.getElementById("winScore").textContent = score;
        document.getElementById("winMoves").textContent = moves;
        document.getElementById("winLevel").textContent = level;
        var last = level >= LEVELS.length;
        document.getElementById("winTitle").textContent = last ? "全部完成!" : "YOU WIN!";
        document.getElementById("winSub").textContent = last
          ? "125 关全部通关，1000 个单词都学完啦！"
          : "全部消完啦，太棒了！";
        document.getElementById("againBtn").textContent = last
          ? "再玩一次 · PLAY AGAIN"
          : "下一关 · NEXT LEVEL";
        var wi = document.getElementById("winIcons");
        wi.innerHTML = "";
        LEVELS[level - 1].forEach(function (k, idx) {
          var s = document.createElement("span");
          s.className = "wi";
          s.style.animationDelay = (idx * 0.09) + "s";
          s.innerHTML = svgCache[k];
          wi.appendChild(s);
        });
        setTimeout(function () {
          winOverlay.classList.add("show");
          confetti();
          fireworks();
          playWinJingle();
          setTimeout(function () { speak("You win!"); }, 550);
        }, 350);
      }

      document.getElementById("againBtn").addEventListener("click", function () {
        // After the final level the button restarts from level 1.
        newGame(level >= LEVELS.length ? 1 : level + 1);
      });

      newGame(1);
    </script>
  </body>
</html>
